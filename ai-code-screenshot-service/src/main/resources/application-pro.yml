spring:
  cloud:
    nacos:
      config:
        namespace: ${NACOS_NAMESPACE:11260589-83b9-47fd-a21f-1ec9819553d6}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        server-addr: ${NACOS_URL}:${NACOS_PORT}
        file-extension: yml
      discovery:
        namespace: ${NACOS_NAMESPACE:11260589-83b9-47fd-a21f-1ec9819553d6}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        server-addr: ${NACOS_URL}:${NACOS_PORT}
  # RabbitMQ 统一走 Nacos 远程配置，本地不再重复声明
  config:
    import:
      - nacos:shared-rabbitmq-pro.yml
# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}



