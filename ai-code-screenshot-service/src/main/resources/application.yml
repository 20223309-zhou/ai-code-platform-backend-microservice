spring:
  profiles:
    active: dev
  application:
    name: ai-code-screenshot
  rabbitmq:
    listener:
      simple:
        prefetch: 1 # 每次只能获取一条消息，处理完成才能获取下一个消息
        retry:
          enabled: true        # 开启失败重试
          max-attempts: 3      # 最多重试 3 次
          initial-interval: 1000   # 首次重试间隔 1s
          multiplier: 2.0      # 每次间隔翻倍
          max-interval: 10000  # 最大间隔 10s
server:
  port: 8126
  servlet:
    context-path: /api


