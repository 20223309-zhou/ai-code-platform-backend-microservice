spring:
  cloud:
    nacos:
      config:
        namespace: ${NACOS_NAMESPACE:11260589-83b9-47fd-a21f-1ec9819553d6}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        server-addr: ${NACOS_URL}:${NACOS_PORT}
        file-extension: yml
      discovery:
        namespace: ${NACOS_NAMESPACE:11260589-83b9-47fd-a21f-1ec9819553d6}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        server-addr: ${NACOS_URL}:${NACOS_PORT}
  # MySQL / Redis / RabbitMQ 统一走 Nacos 远程配置，本地不再重复声明
  config:
    import:
      - nacos:shared-jdbc-pro.yml
      - nacos:shared-redis-pro.yml
      - nacos:shared-rabbitmq-pro.yml