spring:
  cloud:
    nacos:
      config:
        namespace: ${NACOS_NAMESPACE:11260589-83b9-47fd-a21f-1ec9819553d6}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        server-addr: ${NACOS_URL}:${NACOS_PORT}
        file-extension: yml
      discovery:
        namespace: ${NACOS_NAMESPACE:11260589-83b9-47fd-a21f-1ec9819553d6}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        server-addr: ${NACOS_URL}:${NACOS_PORT}
  # MySQL / Redis / RabbitMQ 统一走 Nacos 远程配置，本地不再重复声明
  config:
    import:
      - nacos:shared-jdbc-pro.yml
      - nacos:shared-redis-pro.yml
      - nacos:shared-rabbitmq-pro.yml
# AI
langchain4j:
  open-ai:
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      deepseek-base-url: ${AI_BASE_URL}
      deepseek-api-key: ${AI_API_KEY}
      deepseek-model-name: ${AI_MODEL_NAME}
      # Grok / ChatGPT 共用的聚合网关
      bblabu-base-url: ${BBLABU_BASE_URL:https://api.bblabu.ai/v1}
      grok-api-key: ${GROK_API_KEY:}
      grok-model-name: ${GROK_MODEL_NAME:grok-4.7}
      chatgpt-api-key: ${CHATGPT_API_KEY:}
      chatgpt-model-name: ${CHATGPT_MODEL_NAME:gpt-6.1-sol}
      max-tokens: 62768
      temperature: 0.7
      log-requests: false
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: ${ROUTING_AI_BASE_URL}
      api-key: ${ROUTING_AI_API_KEY}
      model-name: ${ROUTING_AI_MODEL_NAME}
      max-tokens: 100
      temperature: 0.7
      log-requests: false
      log-responses: false
    chat-model:
      # 严格确保结构化输出生效
      #      strict-json-schema: true
      #      response-format: json_object
      max-tokens: 8192
      base-url: ${AI_BASE_URL}
      api-key: ${AI_API_KEY}
      model-name: ${AI_MODEL_NAME}
      log-requests: false
      log-responses: false
      timeout: PT120S
    streaming-chat-model:
      max-tokens: 8192
      base-url: ${AI_BASE_URL}
      api-key: ${AI_API_KEY}
      model-name: ${AI_MODEL_NAME}
      log-requests: false
      log-responses: true
      timeout: PT120S

#部署路径
code:
  deploy-path: http://www.icodeplay.site/dist

cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}
# Qdrant 向量数据库配置
qdrant:
  host: ${QDRANT_URL}
  port: ${QDRANT_PORT}
  collection-name: code_embeddings
  vector-size: 512  # BGE-Small-ZH-V1.5 的向量维度
  distance-type: Cosine

# 会话历史回放预算（冷启动重建对话记忆时用）
app:
  chat-history:
    replay-max-tokens: ${CHAT_HISTORY_REPLAY_MAX_TOKENS:64000}
    scan-limit: ${CHAT_HISTORY_SCAN_LIMIT:400}
    keep-user-ai-rounds: ${CHAT_HISTORY_KEEP_USER_AI_ROUNDS:10}
    keep-tool-rounds: ${CHAT_HISTORY_KEEP_TOOL_ROUNDS:3}
