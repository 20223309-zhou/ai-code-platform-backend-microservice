spring:
  security:
    #登录配置
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user
            redirect-uri: ${FRONTEND_HOME_PAGE_URL}/api/login/oauth2/code/github
  cloud:
    nacos:
      config:
        namespace: ${NACOS_NAMESPACE:11260589-83b9-47fd-a21f-1ec9819553d6}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        server-addr: ${NACOS_URL}:${NACOS_PORT}
        file-extension: yml
      discovery:
        namespace: ${NACOS_NAMESPACE:11260589-83b9-47fd-a21f-1ec9819553d6}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        server-addr: ${NACOS_URL}:${NACOS_PORT}
  # MySQL / Redis 统一走 Nacos 远程配置，本地不再重复声明
  config:
    import:
      - nacos:shared-jdbc-pro.yml
      - nacos:shared-redis-pro.yml
  # 邮件配置（邮箱注册验证码）
  # password 必须填邮箱服务商给出的「授权码」，不是邮箱登录密码
  # 端口与加密必须配对：465 → MAIL_SSL_ENABLE=true；587 → false + 需在 properties 里开 starttls
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}
# 生产地址
frontend:
  homePageUrl: ${FRONTEND_HOME_PAGE_URL}
  authUrl: ${FRONTEND_AUTH_URL}
# 邮箱验证码配置
app:
  mail:
    from: ${MAIL_FROM:}              # 发件地址，留空则回退用 spring.mail.username
    from-name: ${MAIL_FROM_NAME:iCodeAI}
    code-expire-minutes: 5
    send-cooldown-seconds: 60
    daily-limit-per-email: 10
    daily-limit-per-ip: 30
    max-verify-fail: 5
    enforce-allowed-domains: true

